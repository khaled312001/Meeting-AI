name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Trust native postinstall scripts
        run: |
          set -euo pipefail
          for pkg in electron @biomejs/biome @tailwindcss/oxide esbuild sharp core-js unrs-resolver protobufjs workerd; do
            bun pm trust "$pkg" || true
          done

      - name: ESLint
        run: bun run lint

      - name: Typecheck (Next.js UI)
        run: bunx tsc -p tsconfig.json --noEmit

      - name: Typecheck (Electron)
        run: bun run build:electron

      - name: Production build (Next.js static export)
        run: bun run build

  worker:
    name: realtime-worker-api — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-worker-api
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p tsconfig.json --noEmit

      - name: Tests
        run: bun run test
